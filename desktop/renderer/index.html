<!DOCTYPE html>
<html lang="zh-CN" data-glass-tier="full">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'" />
  <title>Alaya · 数据库</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mistakebook.css" />
  <link rel="stylesheet" href="loading.css" />
  <link rel="stylesheet" href="workspace-layout.css" />
  <link rel="stylesheet" href="views.css" />
  <!-- 材质层最后加载：玻璃令牌与表面基元要赢得层叠，但不改布局几何。 -->
  <link rel="stylesheet" href="glass.css" />
  <!-- 参照图复刻层：排版阶梯、素材卡、底部导航与头像。放在最后，覆盖前两层。 -->
  <link rel="stylesheet" href="replica.css" />
  <link rel="stylesheet" href="liquid-glass.css" />
</head>
<body data-mode="memory">
  <div id="alaya-startup" class="alaya-startup" aria-label="Alaya 正在启动"><div class="alaya-loader"><div class="alaya-stage" aria-hidden="true"></div></div></div>
  <div class="app-shell">
    <aside class="side" aria-label="数据库导航">
      <div class="brand"><button id="mode-switch" class="brand-mark" title="切换到笔记本" aria-label="切换到笔记本" aria-pressed="false"><span data-icon="book"></span></button><div><div class="brand-name">Alaya</div><div class="brand-caption">数据库</div></div></div>
      <div class="side-scroll">
        <div class="side-head">资料库</div><nav id="views" class="views" aria-label="记忆视图"></nav>
        <div class="side-head groups-head"><span>记忆组</span><button id="manage-groups" class="icon-button" title="管理记忆组" aria-label="管理记忆组"><span data-icon="plus"></span></button></div>
        <nav id="tree" class="tree" aria-label="记忆组"></nav>
      </div>
      <div class="side-bottom">
        <button id="command-palette" class="nav command-palette-link" title="命令面板 · Ctrl/⌘ K" aria-label="命令面板，快捷键 Ctrl K" aria-keyshortcuts="Control+k Meta+k" aria-haspopup="dialog"><span data-icon="search"></span><span>命令面板</span><kbd>Ctrl K</kbd></button>
        <button id="settings" class="nav settings-link"><span data-icon="settings"></span><span>设置与连接</span><span data-icon="chevron-right" class="trailing"></span></button>
      </div>
    </aside>
    <div class="workspace">
      <header class="bar">
        <!-- 结构按设计稿：左侧玻璃侧栏 → 紧接一枚小搜索圆 → 右上一条玻璃胶囊。
             内容卡片保持实心（示意标注 Solid Content）。 -->
        <div class="bar-left">
          <label class="search-wrap" title="搜索记忆 · Ctrl F"><span data-icon="search"></span><input id="query" class="search" type="search" placeholder="搜索当前范围" aria-label="搜索当前范围的记忆，空格分隔多个关键词" aria-describedby="search-hint" autocomplete="off" /><kbd>Ctrl F</kbd></label>
        </div>
        <div class="toolbar-actions">
          <div class="breadcrumb"><span data-icon="library"></span><span id="breadcrumb">全部记忆</span></div>
          <button id="workspace-settings" class="icon-button" type="button" title="设置" aria-label="设置"><span data-icon="settings"></span></button>
          <button id="capture" class="icon-button" title="快速捕获到记忆或笔记 · Ctrl+Shift+N" aria-label="快速捕获到记忆或笔记，快捷键 Ctrl Shift N" aria-keyshortcuts="Control+Shift+n Meta+Shift+n"><span data-icon="pen"></span></button>
          <button id="refresh" class="icon-button" title="刷新记忆" aria-label="刷新记忆"><span data-icon="refresh"></span></button>
          <button id="new" class="icon-button create-trigger" title="新建记忆 · Ctrl+N" aria-label="新建记忆"><span data-icon="plus"></span></button>
        </div>
      </header>
      <div class="body">
        <main class="main">
          <div class="page-heading"><div><h1 id="view-title">全部记忆</h1></div><div class="view-total"><strong id="view-count">0</strong><span>条记忆</span></div></div>
          <div id="search-context" class="search-context hidden"><span id="search-hint" role="status"></span><span class="spacer"></span><button id="clear-search" type="button" class="btn ghost">清除搜索</button></div>
          <div class="board-toolbar">
            <div class="segmented" role="group" aria-label="显示方式"><button id="view-grid" class="segment active" title="卡片视图" aria-label="卡片视图" aria-pressed="true"><span data-icon="grid"></span></button><button id="view-list" class="segment" title="列表视图" aria-label="列表视图" aria-pressed="false"><span data-icon="list"></span></button><button id="view-table" class="segment" title="表格视图" aria-label="表格视图" aria-pressed="false"><span data-icon="summary"></span></button><button id="view-board" class="segment" title="看板视图" aria-label="看板视图" aria-pressed="false"><span data-icon="layers"></span></button></div>
            <label class="sort-control"><span data-icon="sort"></span><select id="sort" aria-label="记忆排序"><option value="priority">优先级排序</option><option value="updated">最近更新</option><option value="title">按标题排序</option></select></label>
            <button id="view-settings" class="btn soft" type="button" title="视图设置 · 改名、筛选、排序、分组" aria-label="视图设置" aria-haspopup="dialog"><span data-icon="settings"></span><span>视图设置</span><span id="filter-count" class="filter-count hidden"></span></button><span class="spacer"></span>
            <details id="curation-menu" class="curation-menu"><summary class="btn soft"><span data-icon="sparkles"></span><span>AI 整理</span><span data-icon="chevron-down"></span></summary><div class="curation-popover"><h3>整理记忆</h3><p id="curation-hint" class="cap">先预览建议，再决定是否整理保存。</p><button id="curation-setup" type="button" class="btn hidden">连接 AI 服务</button><label class="col"><span class="label">整理范围</span><select id="curate-scope" class="select"><option value="generated">仅 AI 生成</option><option value="manual">仅人工输入</option><option value="all">全部记忆</option></select></label><div class="row"><button id="curate-review" class="btn primary">预览结果</button><button id="curate" class="btn">整理并保存</button></div></div></details>
          </div>
          <div id="list" class="list"></div>
        </main>
        <section id="drawer" class="drawer hidden" aria-label="记忆编辑器"></section>
      </div>
    </div>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
